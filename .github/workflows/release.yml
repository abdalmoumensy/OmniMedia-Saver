name: Build & Release (Windows EXE + Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Portable + Setup Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter yt-dlp imageio-ffmpeg pyinstaller pillow

      - name: Ensure App Icons Exist
        run: |
          if (Test-Path "generate_icons.py") {
            $env:OMNIMEDIA_OUT_DIR="."
            python generate_icons.py
          }

      - name: Build Portable EXE (Single File with App Icon)
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=app_icon.ico --add-data "app_icon.ico;." --collect-all customtkinter --name "OmniMedia-Saver-Portable" omnimedia_saver.py

      - name: Build Directory Bundle for Setup Installer
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=app_icon.ico --add-data "app_icon.ico;." --collect-all customtkinter --name "OmniMediaSaver" omnimedia_saver.py

      - name: Compile Windows Setup Installer (Inno Setup)
        run: |
          iscc installer.iss

      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMedia-Saver-Windows-Portable
          path: dist/OmniMedia-Saver-Portable.exe
          if-no-files-found: error

      - name: Upload Windows Setup Installer EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMedia-Saver-Windows-Installer
          path: dist_installer/OmniMedia-Saver-Setup.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake ccache lld patch

      - name: Ensure Android Icon & Presplash Exist
        run: |
          pip install pillow
          if [ -f "generate_icons.py" ]; then
            OMNIMEDIA_OUT_DIR="." python3 generate_icons.py
          fi

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer, Cython & Compatible Setuptools
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel buildozer==1.5.0 cython==0.29.36

      - name: Build Debug APK
        run: |
          yes | buildozer -v android debug
          mv bin/*.apk bin/OmniMedia-Saver-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMedia-Saver-Android-APK
          path: bin/OmniMedia-Saver-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (EXE + APK)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create / Update GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "OmniMedia Saver v2.0.0 (Windows Installer, Portable EXE & Android APK)"
          body: |
            ### Downloads / التحميل المباشر
            - **Windows Installer (`OmniMedia-Saver-Setup.exe`)**: Standard Windows setup wizard. / نسخة تثبيت كاملة للكمبيوتر.
            - **Windows Portable (`OmniMedia-Saver-Portable.exe`)**: Standalone single-file executable (no install required). / نسخة محمولة تعمل فوراً بدون تثبيت.
            - **Android Mobile (`OmniMedia-Saver-Android.apk`)**: Installable APK for Android phones. / نسخة الهواتف لنظام أندرويد.
          draft: false
          prerelease: false
          files: |
            release_assets/OmniMedia-Saver-Windows-Portable/OmniMedia-Saver-Portable.exe
            release_assets/OmniMedia-Saver-Windows-Installer/OmniMedia-Saver-Setup.exe
            release_assets/OmniMedia-Saver-Android-APK/OmniMedia-Saver-Android.apk
